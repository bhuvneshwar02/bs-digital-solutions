# Render blueprint for the API. Import via Render → New → Blueprint.
# The service name sets the URL: bsinnovationsolutions -> https://bsinnovationsolutions.onrender.com
# Set MONGODB_URI and SEED_ADMIN_* in the dashboard after first deploy,
# then run `npm run seed` once from the service Shell.
services:
  - type: web
    name: bsinnovationsolutions
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bsinnovationsolutions.com,https://www.bsinnovationsolutions.com
      - key: MONGODB_URI
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
